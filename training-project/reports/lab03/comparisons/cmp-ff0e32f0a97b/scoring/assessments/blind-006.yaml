rationale: 'Основне відношення критерію й метрики збережено, але відповідь додає конкретику, якої немає
  в наданому джерелі: приклади властивостей (надійність, безпека, продуктивність), приклад критерію «fast
  response time» з метрикою «average query execution time in milliseconds» і твердження про прийнятний
