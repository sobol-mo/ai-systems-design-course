rationale: 'Джерело описує лише загальне визначення рубрики оцінювання, не називає рубрики департаменту
  й не містить кількості категорій. Очікувана поведінка: прямо сказати, що кількість не визначена, а не
  вигадувати її. Відповідь це робить. Завершальна частина про залежність кількості від задуму рубрики
  є обережним судженням без вигаданого числа. Правило рубрики: правильна невизначеність там, де її очікують,
  — Q.'
