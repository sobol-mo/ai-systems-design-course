source_pointer: A metric is a defined measurement whose values can be compared against the criterion to
  judge whether that property holds.
rationale: 'Відповідь зберігає зв’язок з очікуваної поведінки: критерій задає властивість якості, метрика
  є визначеним вимірюванням, значення якого порівнюють із критерієм. Усі змістовні твердження підкріплені
  джерелом; сторонніх відомостей немає. Правило рубрики: підкріплена й повна відповідь — S. Формулювання
  «numerical values» і «quantifiable evidence» уточнюють переказ і не змінюють підкріпленого зв’язку.'
