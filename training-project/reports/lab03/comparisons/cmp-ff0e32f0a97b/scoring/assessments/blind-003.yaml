rationale: 'Відповідь зберігає зв’язок з очікуваної поведінки: критерій задає властивість якості, метрика
  є визначеним вимірюванням, значення якого порівнюють із критерієм. Усі змістовні твердження підкріплені
  джерелом; сторонніх відомостей немає. Правило рубрики: підкріплена й повна відповідь — S. Образне протиставлення
  «what» і «how» є переказом, зв’язок порівняння з критерієм збережено.'
