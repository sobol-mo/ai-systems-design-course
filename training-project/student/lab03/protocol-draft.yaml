engineering_decision: "Should Variant B replace Variant A for source-grounded answers to the evaluated tasks?"

hypothesis: "Explicit source-grounding instructions in Variant B will reduce unsupported material claims while preserving complete answers when the source contains sufficient information."

semantic_acceptance: "For each variant, count S and Q responses that match the task's expected behavior as the numerator. Use all assessable responses (S, I, U, Q, R) as the denominator. Require at least 75% acceptance, with at least one assessable response."

blocking_failures: "Any U (unsupported material claim) is a critical blocking failure for that variant."

operational_acceptance: "Returned responses must have latency of at most 60 seconds, measured from attempt start to response return. Unknown latency or usage measurements must be reported as unknown and cannot establish operational superiority."

tradeoff_rule: "Recommend B over acceptable A only if B satisfies all blocking conditions, meets semantic and operational acceptance, and demonstrates better source support without worse meaning coverage. Do not claim dominance when a relevant dimension is unknown."

decision_rule:
  recommend-b: "B meets all acceptance conditions and demonstrates a justified improvement over A."
  retain-a: "A meets all acceptance conditions, while B does not demonstrate a justified improvement."
  reject-both: "Both variants violate at least one blocking condition."
  seek-more-evidence: "Relevant evidence is missing, insufficient, contradictory, or operational uncertainty prevents a justified decision."

attempt_budget: 16

timing_boundary: "Elapsed time from the recorded start of an attempt until its returned response, measured identically for both variants."

route:
  adapter: openrouter
  model_id: openrouter/free
